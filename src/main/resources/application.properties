spring.application.name=driver-service
server.port=8082

# MongoDB Configuration (Supports local MongoDB and online MongoDB Atlas cluster via environment variable)
spring.data.mongodb.uri=${MONGODB_URI:${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/ridelink_drivers}}
spring.data.mongodb.auto-index-creation=true

jwt.secret=${JWT_SECRET:RideLinkSecretKeyForJWTTokenGenerationMustBeLongEnough256Bits!!}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

logging.level.com.driver_service=INFO

